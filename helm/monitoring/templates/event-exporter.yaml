apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-exporter
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: event-exporter
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: event-exporter
subjects:
  - kind: ServiceAccount
    name: event-exporter
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: event-exporter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-exporter
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-exporter
  template:
    metadata:
      labels:
        app: event-exporter
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/event-exporter-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: event-exporter
      containers:
        - name: event-exporter
          image: {{ .Values.eventExporter.image }}
          args:
            - -conf=/data/config.yaml
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: event-exporter
