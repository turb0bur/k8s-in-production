apiVersion: v1
kind: ConfigMap
metadata:
  name: event-exporter
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    logLevel: error
    logFormat: json
    route:
      routes:
        - match:
            {{- range .Values.eventExporter.reasons }}
            - reason: {{ . }}
              receiver: stdout
            {{- end }}
    receivers:
      - name: stdout
        stdout: {}
