{{- range $user := .Values.users }}
{{- range $access := list "rw" "ro" }}
{{- range $ns := (get $user $access | default list) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $user.name }}-ns-{{ $access }}
  namespace: {{ $ns }}
subjects:
  - kind: User
    name: {{ $user.name }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: ns-{{ $access }}
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
{{- end }}
{{- end }}