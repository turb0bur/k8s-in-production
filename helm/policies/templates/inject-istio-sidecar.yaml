apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: inject-istio-sidecar
  annotations:
    policies.kyverno.io/title: Inject Istio Sidecar
    policies.kyverno.io/category: Service Mesh
    policies.kyverno.io/description: >-
      Pods with the label {{ .Values.personLabel }}={{ .Values.istio.personValue }} get the label {{ .Values.istio.injectLabel }}=true,
      which makes the Istio sidecar injector add the istio-proxy container. A pod that already sets
      {{ .Values.istio.injectLabel }} is left untouched. Requires sidecarInjectorWebhook.reinvocationPolicy=IfNeeded
      in Istio, because the person label is added by Kyverno after Istio first sees the pod.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: person-label-matches
      expression: >-
        has(object.metadata.labels) && "{{ .Values.personLabel }}" in object.metadata.labels
        && object.metadata.labels["{{ .Values.personLabel }}"] == "{{ .Values.istio.personValue }}"
    - name: inject-label-not-set
      expression: >-
        !has(object.metadata.labels) || !("{{ .Values.istio.injectLabel }}" in object.metadata.labels)
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              labels: {"{{ .Values.istio.injectLabel }}": "true"}
            }
          }