apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-person-label
  annotations:
    policies.kyverno.io/title: Add person Label
    policies.kyverno.io/category: Labeling
    policies.kyverno.io/description: >-
      Adds the label person to pods, copying the value from the role label of
      the pod's namespace (student or mentor). Namespaces without a role label
      are not matched, so their pods never get the label. A person label that
      is already set is left untouched so the validating policy can report it.
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: role
          operator: In
          values: [student, mentor]
  matchConditions:
    - name: person-label-not-set
      expression: >-
        !has(object.metadata.labels) || !("person" in object.metadata.labels)
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              labels: {"person": namespaceObject.metadata.labels["role"]}
            }
          }